name: 'Gemini Code Reviewer'
description: 'Uses Google Gemini to review Pull Requests.'
inputs:
  gemini_api_key:
    description: 'API Key for Google Gemini'
    required: true
  github_token:
    description: 'GitHub Token to access PR diffs and post comments'
    required: true
runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
    GITHUB_TOKEN: ${{ inputs.github_token }}
