name: Test Gemini Action

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build . -t gemini-helper

      - name: Run Action (Dry Run)
        # We don't have real secrets in this environment usually, so we might fail or mock.
        # Here we just verify the script runs and fails gracefully or prints help.
        run: |
          docker run --env GEMINI_API_KEY="dummy" --env GITHUB_TOKEN="dummy" --env GITHUB_REPOSITORY="owner/repo" --env GITHUB_EVENT_PATH="/tmp/event.json" gemini-helper || true
